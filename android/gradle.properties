org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# :openverify-sdk declares iosArm64 and iosSimulatorArm64. On Linux, Kotlin cross-compiles their klibs
# (on by default since 2.2.20), but linking and running iOS code needs macOS; this keeps the
# "disabled targets" warning out of every Linux build.
kotlin.native.ignoreDisabledTargets=true
# C214.3: the one version of every published Android artifact (0.x until the first release, C214.4).
# :openverify-sdk generates its commonMain constant OPENVERIFY_SDK_VERSION from it, which the
# User-Agent `OpenVerify-Android/<version>` carries (C193.7).
openverifyVersion=0.1.0
# C217.1, C217.5 (Phase 10 P4, pending): the Maven group of every published artifact. Provisional: the
# namespace is the owner's to register; nothing is uploaded, and the staged repository is the release
# (C217.3). The Kotlin packages stay dev.openverify.* whatever the group becomes.
openverifyGroup=dev.openverify
# C218.1: which optional artifacts the demo app includes, comma-separated. `sdk` (the default) is
# :openverify-sdk alone; `nfc` adds openverify-nfc and `face` adds openverify-face (sdk,nfc; sdk,face;
# sdk,nfc,face). Each configuration has its own lockfile and manifest allowlist in demo-app/.
# Override per build: -PopenverifyDemoArtifacts=sdk,nfc
openverifyDemoArtifacts=sdk
