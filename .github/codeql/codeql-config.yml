# CodeQL configuration for .github/workflows/codeql.yml (Workflow 11G, codeql-11g; C260.2).
# Contract test: infra/tests/codeql-workflow.test.sh (every excluded path keeps its reason on the
# line above it and must still match a tracked file).
#
# CodeQL is informational here: it gates nothing, so the wider security suite costs only triage.
# paths-ignore applies to the languages extracted without a build (javascript-typescript, python);
# the compiled java-kotlin analysis sees exactly what its traced Gradle build compiles, which is the
# Android main sources of android/ (no test source set is in assembleDebug).
name: openverify-codeql

queries:
  - uses: security-extended

paths-ignore:
  # Exported cross-language test fixtures (rule 23): JSON vectors and recorded problems, data that
  # each language's own tests read, never code that runs.
  - contracts/fixtures
  # Full-stack test fixtures: the embed page Playwright serves to frame the flow and the Android
  # stack tests' flow definitions; test inputs only, never shipped.
  - e2e/fixtures
  # Documents, most of them generated by packages/docs-tools (the catalog, the self-hosting and
  # security records, docs/api/openapi.json, the release notes); no product code lives under docs/.
  - docs
  # Vendored third-party notices copied unchanged into the flow image (ONNX Runtime's, Phase 10 P2).
  - apps/flow/licenses
  # Generated by packages/checks/scripts/generate-iso3166.py from the pinned iso3166 data package: a
  # constant table with no logic (the generator itself stays analysed).
  - packages/checks/src/data/iso3166.ts
