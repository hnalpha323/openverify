{{- /*
C263.5 (Workflow 11C Stage 2, chart-11c; decision 5, reviews P05 and F05, verification V03): in job
mode, the models-fetch Job, a pre-install,pre-upgrade hook weighted after the claim, in its own pod:
no Secret, no service-account token, the restricted contexts, labelled component models-fetch so
chart-policy-11c's egress policy alone lets it reach the model hosts. It runs, with no shell, the
chart's program files/models-fetch.py as `python3 -I -c` in the vision image, which runs the image's
scripts/fetch_models.py (pinned SHA-256s) into /models/<manifest digest>/, exits 0 at once when that
directory is complete, refuses an image whose manifest is not the chart's, and keeps only the current
and the previous directory. On upgrade with a ReadWriteOnce claim it runs on the vision pods' node,
where the claim is attached.
*/ -}}
{{- if eq .Values.models.source "job" }}
{{- include "openverify.checks" . }}
{{- $v := .Values.modelsFetch }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openverify.componentName" (dict "root" . "component" "models-fetch") }}
  labels:
    {{- include "openverify.labels" (dict "root" . "component" "models-fetch") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-5'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  # About 75 MB of weights from their publishers.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        {{- include "openverify.labels" (dict "root" . "component" "models-fetch") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "openverify.podSpecCommon" (dict "root" . "c" (dict)) | nindent 6 }}
      {{- if and .Release.IsUpgrade (eq .Values.models.accessMode "ReadWriteOnce") }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "openverify.selectorLabels" (dict "root" . "component" "vision") | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: models-fetch
          image: {{ include "openverify.image" (dict "root" . "image" $v.image) | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy | default "IfNotPresent" }}
          command:
            - python3
            - -I
            - -c
            - {{ .Files.Get "files/models-fetch.py" | quote }}
            - {{ include "openverify.modelsDigest" . | quote }}
            - /app/models/manifest.json
            - /app/scripts/fetch_models.py
          securityContext:
            {{- include "openverify.containerSecurityContext" (dict "root" .) | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            {{- include "openverify.tmpVolumeMount" (dict "root" .) | nindent 12 }}
            - name: models
              mountPath: /models
      volumes:
        {{- include "openverify.tmpVolume" (dict "root" .) | nindent 8 }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "openverify.modelsClaim" . }}
{{- end }}
