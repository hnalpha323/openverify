<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Verification journey</title>
<desc id="desc">How a verification works: create an inquiry, the user verifies in the web flow or the Android SDK, checks run, a decision is made, and your server is notified by webhook.</desc>
<defs>
  <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker>
  <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b8bff"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="271" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="30" y="30" width="200" height="196" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<circle cx="60" cy="64" r="15" fill="#3b8bff"/>
<text x="60" y="69" font-size="14" font-weight="700" fill="#030712" text-anchor="middle">1</text>
<text x="48" y="112" font-size="16" font-weight="650" fill="#e6edf3">Create an inquiry</text>
<text x="48" y="138" font-size="12.5" fill="#9198a1">Your server calls the API</text>
<text x="48" y="157" font-size="12.5" fill="#9198a1">with a template and gets a</text>
<text x="48" y="176" font-size="12.5" fill="#9198a1">one-time link or a session</text>
<text x="48" y="195" font-size="12.5" fill="#9198a1">token for the user</text>
<path d="M234 128.0 L261 128.0" fill="none" stroke="#3b8bff" stroke-width="1.6" marker-end="url(#ah-a)"/>
<rect x="265" y="30" width="200" height="196" rx="12" fill="#0c1a36" stroke="#3b8bff" stroke-width="1.3"/>
<circle cx="295" cy="64" r="15" fill="#3b8bff"/>
<text x="295" y="69" font-size="14" font-weight="700" fill="#030712" text-anchor="middle">2</text>
<text x="283" y="112" font-size="16" font-weight="650" fill="#e6edf3">The user verifies</text>
<text x="283" y="138" font-size="12.5" fill="#9198a1">Web flow or Android SDK:</text>
<text x="283" y="157" font-size="12.5" fill="#9198a1">consent, ID front and back,</text>
<text x="283" y="176" font-size="12.5" fill="#9198a1">selfie with liveness, and</text>
<text x="283" y="195" font-size="12.5" fill="#9198a1">the passport chip by NFC</text>
<path d="M469 128.0 L496 128.0" fill="none" stroke="#3b8bff" stroke-width="1.6" marker-end="url(#ah-a)"/>
<rect x="500" y="30" width="200" height="196" rx="12" fill="#0c1a36" stroke="#3b8bff" stroke-width="1.3"/>
<circle cx="530" cy="64" r="15" fill="#3b8bff"/>
<text x="530" y="69" font-size="14" font-weight="700" fill="#030712" text-anchor="middle">3</text>
<text x="518" y="112" font-size="16" font-weight="650" fill="#e6edf3">Checks run</text>
<text x="518" y="138" font-size="12.5" fill="#9198a1">The worker and the vision</text>
<text x="518" y="157" font-size="12.5" fill="#9198a1">service run the template&#x27;s</text>
<text x="518" y="176" font-size="12.5" fill="#9198a1">checks over the images, the</text>
<text x="518" y="195" font-size="12.5" fill="#9198a1">extracted data and signals</text>
<path d="M704 128.0 L731 128.0" fill="none" stroke="#3b8bff" stroke-width="1.6" marker-end="url(#ah-a)"/>
<rect x="735" y="30" width="200" height="196" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<circle cx="765" cy="64" r="15" fill="#3b8bff"/>
<text x="765" y="69" font-size="14" font-weight="700" fill="#030712" text-anchor="middle">4</text>
<text x="753" y="112" font-size="16" font-weight="650" fill="#e6edf3">A decision</text>
<text x="753" y="138" font-size="12.5" fill="#9198a1">Approved, declined, or sent</text>
<text x="753" y="157" font-size="12.5" fill="#9198a1">to manual review, by the</text>
<text x="753" y="176" font-size="12.5" fill="#9198a1">template&#x27;s rules and your</text>
<text x="753" y="195" font-size="12.5" fill="#9198a1">workflows</text>
<path d="M939 128.0 L966 128.0" fill="none" stroke="#3b8bff" stroke-width="1.6" marker-end="url(#ah-a)"/>
<rect x="970" y="30" width="200" height="196" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
<circle cx="1000" cy="64" r="15" fill="#3b8bff"/>
<text x="1000" y="69" font-size="14" font-weight="700" fill="#030712" text-anchor="middle">5</text>
<text x="988" y="112" font-size="16" font-weight="650" fill="#e6edf3">You are notified</text>
<text x="988" y="138" font-size="12.5" fill="#9198a1">Signed webhooks reach your</text>
<text x="988" y="157" font-size="12.5" fill="#9198a1">server; reviewers work the</text>
<text x="988" y="176" font-size="12.5" fill="#9198a1">case in the operator</text>
<text x="988" y="195" font-size="12.5" fill="#9198a1">console</text>
<text x="30" y="257" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">Sandbox environments can simulate an inquiry&#x27;s lifecycle, so you can build against the API before a real user verifies.</text>
</svg>
