- id: GHSA-fc5q-39xc-vjpf
  package: picomatch
  reason: >-
    No fixed release: OSV marks picomatch up to 4.0.7, its newest release, as affected (read 2026-11-18). Every path to it is a devDependency (vite, vitest, typescript-eslint, eslint's file-entry-cache; pnpm why picomatch -r shows no production path), so no image or published package holds it, and its ReDoS needs an attacker's extglob where only the tools' own globs reach it. Take the fix once it is 14 days old.
  expires: 2027-01-31
