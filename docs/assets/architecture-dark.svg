<text x="46" y="224" font-size="12.5" fill="#9198a1">Kotlin Multiplatform · CameraX</text>
<text x="46" y="242" font-size="12.5" fill="#9198a1">optional NFC chip and face modules</text>
<path d="M310 218 L352 218" fill="none" stroke="#6e7681" stroke-width="1.6"/>
