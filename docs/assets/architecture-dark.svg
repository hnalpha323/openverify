<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Architecture</title>
<desc id="desc">OpenVerify architecture: the flow, the Android SDK, your backend and the operator console talk to the API over HTTPS; the API queues jobs for the worker, which calls the vision service and the code runner; both use PostgreSQL, Valkey, an S3 API and SMTP.</desc>
<defs>
  <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker>
  <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b8bff"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="639" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="30" y="50" font-size="11" font-weight="700" fill="#9198a1" text-anchor="start">WHO USES IT</text>
<text x="890" y="50" font-size="11" font-weight="700" fill="#9198a1" text-anchor="start">INTERNAL SERVICES</text>
<text x="612" y="530" font-size="11" font-weight="700" fill="#9198a1" text-anchor="start">DATA STORES (STANDARD PROTOCOLS ONLY)</text>
<rect x="30" y="70" width="280" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
