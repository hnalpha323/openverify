<text x="446" y="187" font-size="12.5" fill="#9198a1">inquiries, verifications, reports, accounts,</text>
<text x="446" y="205" font-size="12.5" fill="#9198a1">cases, lists, graph, transactions</text>
<rect x="430" y="320" width="340" height="128" rx="10" fill="#0d1117" stroke="#3b8bff" stroke-width="1.6"/>
<text x="446" y="348" font-size="16" font-weight="650" fill="#e6edf3">Worker</text>
<text x="446" y="369" font-size="12.5" fill="#9198a1">BullMQ jobs: 89 checks, 11 report types,</text>
<text x="446" y="387" font-size="12.5" fill="#9198a1">19 signals, workflows, list screening,</text>
<text x="446" y="405" font-size="12.5" fill="#9198a1">webhooks, retention</text>
<path d="M600 240 L600 318" fill="none" stroke="#3b8bff" stroke-width="1.6" marker-end="url(#ah-a)"/>
<text x="610" y="284" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">jobs on Valkey</text>
<path d="M430 420 L376 420 L376 345 L312 345" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-n)"/>
<text x="391" y="383" font-size="10.5" fill="#9198a1" text-anchor="middle" transform="rotate(-90 391 383)">webhooks</text>
<rect x="890" y="120" width="280" height="140" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="906" y="148" font-size="16" font-weight="650" fill="#e6edf3">Vision service</text>
<text x="906" y="169" font-size="12.5" fill="#9198a1">Python 3.12 · FastAPI · ONNX</text>
<text x="906" y="187" font-size="12.5" fill="#9198a1">face detection and match, liveness,</text>
<text x="906" y="205" font-size="12.5" fill="#9198a1">OCR, MRZ, PDF417, document forensics</text>
<text x="906" y="223" font-size="12.5" fill="#9198a1">no outbound network</text>
<rect x="890" y="325" width="280" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="906" y="353" font-size="16" font-weight="650" fill="#e6edf3">Code runner</text>
<text x="906" y="374" font-size="12.5" fill="#9198a1">Sandboxed workflow code steps</text>
<text x="906" y="392" font-size="12.5" fill="#9198a1">no network, read-only</text>
