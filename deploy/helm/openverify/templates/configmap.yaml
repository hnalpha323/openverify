{{- /*
C263.2 (Workflow 11C Stage 2, chart-11c): one ConfigMap per long-running process, holding only the
non-secret variables it reads (templates/_config.tpl). migrate's configuration is inlined into its
Job instead, because a pre-install hook runs before the release's ConfigMaps exist.
*/ -}}
{{- include "openverify.checks" . -}}
{{- $components := list (list "api" "api") (list "worker" "worker") (list "dashboard" "dashboard") (list "flow" "flow") (list "vision" "vision") -}}
{{- if .Values.codeRunner.enabled -}}
{{- $components = append $components (list "codeRunner" "code-runner") -}}
{{- end -}}
{{- range $pair := $components }}
{{- $process := index $pair 0 }}
{{- $component := index $pair 1 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openverify.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "openverify.labels" (dict "root" $ "component" $component) | nindent 4 }}
data:
  {{- include "openverify.configData" (dict "root" $ "process" $process) | nindent 2 }}
{{- end }}
